spring:
  application:
    name: hoard-keeper

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway odpowiada za tworzenie schematu, JPA tylko weryfikuje spójność
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN}