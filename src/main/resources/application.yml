spring:
  application:
    name: hoard-keeper

  datasource:
    url: jdbc:postgresql://localhost:5432/hoard_keeper_db
    username: hoard_user
    password: hoard_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway odpowiada za tworzenie schematu, JPA tylko weryfikuje spójność
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN:your-default-token-here}